name: Python tests

on:
  push:
    branches: ["main", "docs/ci-readme-quality-2026"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create legacy temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path (Split-Path -Qualifier (Get-Location)) "tmp")
      - name: Run tests
        run: python -m pytest tests/ -q

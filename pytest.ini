[pytest]
# Qualitätsdisziplin (Nutzerregel 05.09.2026): JEDER Lauf strikt –
# Warnungen sind Fehler und werden an der Wurzel behoben, nie weg-
# gefiltert. Best Practice: jaraco/skeleton-Muster (filterwarnings=error).
filterwarnings =
    error
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
testpaths = tests
